<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文心一言 - 个人数据资产下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; min-height: 100vh; }

/* 顶部导航 */
.top-nav { height: 56px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
.nav-logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1a1a1a; }
.nav-logo svg { width: 28px; height: 28px; }
.nav-avatar { width: 32px; height: 32px; background: #e0e0e0; border-radius: 50%; }

/* 主体布局 */
.main-layout { display: flex; margin-top: 56px; min-height: calc(100vh - 56px); }

/* 左侧菜单 */
.sidebar { width: 240px; background: #fff; border-right: 1px solid #f0f0f0; padding: 24px 0; position: fixed; top: 56px; bottom: 0; overflow-y: auto; }
.sidebar-item { padding: 12px 24px; font-size: 14px; color: #666; cursor: pointer; display: block; text-decoration: none; }
.sidebar-item:hover { color: #333; background: #fafafa; }
.sidebar-item.active { color: #4e6ef2; font-weight: 500; background: #eef1ff; border-right: 3px solid #4e6ef2; }

/* 右侧内容 */
.content { margin-left: 240px; flex: 1; padding: 32px 40px; }

/* 页面标题区 */
.page-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-title { font-size: 18px; font-weight: 600; color: #1a1a1a; border-bottom: 3px solid #4e6ef2; padding-bottom: 12px; }
.page-actions { display: flex; align-items: center; gap: 12px; }

/* 提醒条 */
.notice-bar { font-size: 13px; color: #666; line-height: 1.8; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 10px 16px; margin-bottom: 20px; }
.notice-bar strong { color: #d4380d; }

/* 操作栏 */
.action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
.action-bar-left { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #999; }
.action-bar-right { display: flex; align-items: center; gap: 12px; }
.btn-cancel { padding: 7px 20px; background: #fff; color: #333; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; cursor: pointer; }
.btn-cancel:hover { border-color: #4e6ef2; color: #4e6ef2; }
.btn-confirm { padding: 7px 20px; background: #4e6ef2; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
.btn-confirm:hover { background: #3d5bd9; }
.btn-confirm:disabled { background: #c5d0f9; cursor: not-allowed; }

/* 表格 */
.table-card { background: #fff; border-radius: 8px; border: 1px solid #f0f0f0; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: #fafafa; padding: 12px 16px; font-size: 13px; color: #999; font-weight: 400; text-align: left; border-bottom: 1px solid #f0f0f0; }
th:first-child { padding-left: 20px; width: 40px; }
td { padding: 16px; font-size: 13px; color: #333; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
td:first-child { padding-left: 20px; }
tr:last-child td { border-bottom: none; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4e6ef2; cursor: pointer; }

.asset-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
.asset-desc { font-size: 12px; color: #999; margin-top: 3px; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.status-none { color: #999; background: #f5f5f5; }
.status-queued { color: #d48806; background: #fffbe6; }
.status-downloading { color: #1890ff; background: #e6f7ff; }
.status-success { color: #52c41a; background: #f6ffed; }
.status-failed { color: #ff4d4f; background: #fff2f0; }

.btn-download { padding: 4px 12px; background: #4e6ef2; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-download:hover { background: #3d5bd9; }
.btn-download:disabled { background: #e8e8e8; color: #bbb; cursor: not-allowed; }
.btn-retry { padding: 4px 12px; background: #fff; color: #ff4d4f; border: 1px solid #ff4d4f; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-retry:hover { background: #fff2f0; }
.download-link { color: #4e6ef2; text-decoration: none; font-size: 12px; cursor: pointer; }
.download-link:hover { text-decoration: underline; }
.fail-reason { font-size: 11px; color: #ff4d4f; margin-top: 2px; }

.tips { margin-top: 16px; font-size: 12px; color: #b0b0b0; line-height: 1.8; }

/* 状态切换器 */
.state-switcher { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); z-index: 300; }
.state-btn { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 11px; cursor: pointer; background: #fff; color: #666; white-space: nowrap; }
.state-btn:hover { background: #f5f5f5; }
.state-btn.active { background: #4e6ef2; color: #fff; border-color: #4e6ef2; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
  <div class="nav-logo">
    <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#4e6ef2"/><text x="7" y="19" font-size="12" fill="#fff" font-weight="bold">文</text></svg>
    文心一言
  </div>
  <div class="nav-avatar"></div>
</div>

<!-- 主体 -->
<div class="main-layout">
  <!-- 左侧菜单 -->
  <div class="sidebar">
    <a class="sidebar-item" href="#">服务合并升级说明</a>
    <a class="sidebar-item active" href="#">数据资产下载</a>
  </div>

  <!-- 右侧内容 -->
  <div class="content">
    <div class="page-title-bar">
      <div class="page-title">数据资产下载</div>
    </div>

    <div class="notice-bar">
      请在 <strong>2026年7月26日 0点前</strong> 完成下载。勾选需要导出的内容，点击「确认下载」开始导出。下载文件较大，下载时间可能较长，建议稍晚再返回本页面查看下载结果。下载完成后，您可在操作栏点击下载链接自行存储数据资产到本地。
    </div>

    <div class="action-bar">
      <div class="action-bar-left">已选 <span id="selectedCount">0</span> 项</div>
      <div class="action-bar-right">
        <button class="btn-cancel" onclick="cancelAll()">取消</button>
        <button class="btn-confirm" id="btnConfirm" disabled onclick="batchDownload()">确认下载</button>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
            <th>资产类别</th>
            <th>提交时间</th>
            <th>下载状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="tips">
      提示：下载任务提交后将在后台排队处理，您可随时返回本页面查看进度。如遇问题请联系客服 yiyan-service@baidu.com
    </div>
  </div>
</div>

<!-- 原型状态切换器（仅供演示） -->
<div class="state-switcher">
  <button class="state-btn active" onclick="setState('initial')">初始状态</button>
  <button class="state-btn" onclick="setState('submitted')">已提交</button>
  <button class="state-btn" onclick="setState('partial')">部分完成</button>
  <button class="state-btn" onclick="setState('allDone')">全部完成</button>
  <button class="state-btn" onclick="setState('failed')">下载失败</button>
</div>

<script>
const assets = [
  { name: '历史对话记录', desc: '对话session、文档、图片、音频、视频' },
  { name: '个人记忆 & 指令库', desc: '记忆和指令库' },
  { name: '项目对话记录', desc: '项目对话session及相关上传、生成文件' },
  { name: '收藏对话/文档/图片', desc: '收藏的对话、文档、图片' },
  { name: '创意写作Agent', desc: '生成的最终交付文件' },
  { name: '超级智能体', desc: 'query与answer对话记录及相关文件' }
];

const states = {
  initial: assets.map(() => ({ status: 'none', time: '-' })),
  submitted: assets.map(() => ({ status: 'queued', time: '2026-06-25 10:32' })),
  partial: [
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'downloading', time: '2026-06-25 10:32' },
    { status: 'queued', time: '2026-06-25 10:32' },
    { status: 'none', time: '-' },
    { status: 'none', time: '-' }
  ],
  allDone: assets.map(() => ({ status: 'success', time: '2026-06-25 10:32' })),
  failed: [
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'failed', time: '2026-06-25 10:32', reason: '文件过大，请联系客服处理' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'none', time: '-' },
    { status: 'none', time: '-' }
  ]
};

const statusMap = {
  none: { label: '未下载', cls: 'status-none' },
  queued: { label: '已提交待下载', cls: 'status-queued' },
  downloading: { label: '下载中', cls: 'status-downloading' },
  success: { label: '下载成功', cls: 'status-success' },
  failed: { label: '下载失败', cls: 'status-failed' }
};

function renderTable(stateData) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = stateData.map((item, i) => {
    const s = statusMap[item.status];
    const canCheck = item.status === 'none';
    let action = '';
    if (item.status === 'none') action = '<button class="btn-download" onclick="singleDownload(this)">下载</button>';
    else if (item.status === 'queued' || item.status === 'downloading') action = '<button class="btn-download" disabled>下载</button>';
    else if (item.status === 'success') action = '<a class="download-link" href="#">下载链接</a>';
    else if (item.status === 'failed') action = '<button class="btn-retry">重新下载</button>';

    const failHtml = item.reason ? `<div class="fail-reason">${item.reason}</div>` : '';

    return `<tr>
      <td><input type="checkbox" class="row-check" ${canCheck ? '' : 'disabled'} onchange="updateSelection()"></td>
      <td><div class="asset-name">${assets[i].name}</div><div class="asset-desc">${assets[i].desc}</div></td>
      <td style="color:#999;">${item.time}</td>
      <td><span class="status ${s.cls}">${s.label}</span>${failHtml}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');
  updateSelection();
}

function toggleAll(el) {
  document.querySelectorAll('.row-check:not(:disabled)').forEach(cb => cb.checked = el.checked);
  updateSelection();
}

function updateSelection() {
  const checked = document.querySelectorAll('.row-check:checked').length;
  const total = document.querySelectorAll('.row-check:not(:disabled)').length;
  document.getElementById('selectedCount').textContent = checked;
  document.getElementById('btnConfirm').disabled = checked === 0;
  document.getElementById('selectAll').checked = total > 0 && checked === total;
}

function setState(state) {
  renderTable(states[state]);
  document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function singleDownload(btn) { btn.disabled = true; btn.textContent = '已提交'; }
function batchDownload() {}
function cancelAll() { document.querySelectorAll('.row-check').forEach(cb => cb.checked = false); updateSelection(); }

renderTable(states.initial);
</script>
</body>
</html>
