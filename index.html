<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文心一言 - 个人数据资产下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; min-height: 100vh; padding: 40px 20px; }

.container { max-width: 900px; margin: 0 auto; }

.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; }
.page-desc { font-size: 13px; color: #666; line-height: 1.8; background: #fff8e6; border: 1px solid #ffe58f; border-radius: 8px; padding: 12px 16px; }
.page-desc strong { color: #d4380d; }

.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }

.card-header { padding: 16px 24px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.card-header-left { display: flex; align-items: center; gap: 12px; }
.card-header-left input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4e6ef2; cursor: pointer; }
.card-header-left label { font-size: 14px; color: #333; cursor: pointer; }
.btn-batch { padding: 8px 20px; background: #4e6ef2; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
.btn-batch:hover { background: #3d5bd9; }
.btn-batch:disabled { background: #c5d0f9; cursor: not-allowed; }

table { width: 100%; border-collapse: collapse; }
th { background: #fafafa; padding: 12px 16px; font-size: 13px; color: #666; font-weight: 500; text-align: left; border-bottom: 1px solid #f0f0f0; }
th:first-child { padding-left: 24px; width: 40px; }
td { padding: 14px 16px; font-size: 13px; color: #333; border-bottom: 1px solid #f8f8f8; vertical-align: middle; }
td:first-child { padding-left: 24px; }
tr:last-child td { border-bottom: none; }

.asset-name { font-weight: 500; font-size: 14px; }
.asset-desc { font-size: 12px; color: #999; margin-top: 2px; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
.status-none { color: #999; background: #f5f5f5; }
.status-queued { color: #d48806; background: #fffbe6; }
.status-downloading { color: #1890ff; background: #e6f7ff; }
.status-success { color: #52c41a; background: #f6ffed; }
.status-failed { color: #ff4d4f; background: #fff2f0; }

.btn-download { padding: 5px 14px; background: #4e6ef2; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-download:hover { background: #3d5bd9; }
.btn-download:disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }
.btn-retry { padding: 5px 14px; background: #fff; color: #ff4d4f; border: 1px solid #ff4d4f; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-retry:hover { background: #fff2f0; }
.download-link { color: #4e6ef2; text-decoration: none; font-size: 12px; }
.download-link:hover { text-decoration: underline; }

.tips { margin-top: 16px; font-size: 12px; color: #b0b0b0; line-height: 1.8; padding: 0 4px; }

/* 状态切换器 */
.state-switcher { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); z-index: 300; }
.state-btn { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 11px; cursor: pointer; background: #fff; color: #666; white-space: nowrap; }
.state-btn:hover { background: #f5f5f5; }
.state-btn.active { background: #4e6ef2; color: #fff; border-color: #4e6ef2; }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>个人数据资产下载</h1>
    <div class="page-desc">
      请在 <strong>2026年7月26日 0点前</strong> 完成下载。勾选需要导出的内容，点击下载按钮开始导出。下载文件较大，下载时间可能较长，建议稍晚再返回本页面查看下载结果。下载完成后，您可在操作栏点击下载链接自行存储数据资产到本地。
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-header-left">
        <input type="checkbox" id="selectAll" onchange="toggleAll(this)">
        <label for="selectAll">全选</label>
      </div>
      <button class="btn-batch" id="btnBatch" disabled onclick="batchDownload()">批量下载</button>
    </div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>资产类别</th>
          <th>提交时间</th>
          <th>下载状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <div class="tips">
    提示：下载需排队处理，预计等待时间视当前排队人数而定。如遇问题请联系客服 yiyan-service@baidu.com
  </div>
</div>

<!-- 原型状态切换器（仅供演示） -->
<div class="state-switcher">
  <button class="state-btn active" onclick="setState('initial')">初始状态</button>
  <button class="state-btn" onclick="setState('submitted')">已提交</button>
  <button class="state-btn" onclick="setState('partial')">部分完成</button>
  <button class="state-btn" onclick="setState('allDone')">全部完成</button>
  <button class="state-btn" onclick="setState('failed')">下载失败</button>
</div>

<script>
const assets = [
  { name: '历史对话记录', desc: '对话session、文档、图片、音频、视频' },
  { name: '个人记忆 & 指令库', desc: '记忆和指令库' },
  { name: '项目对话记录', desc: '项目对话session及相关上传、生成文件' },
  { name: '收藏对话/文档/图片', desc: '收藏的对话、文档、图片' },
  { name: '创意写作Agent', desc: '生成的最终交付文件' },
  { name: '超级智能体', desc: 'query与answer对话记录及相关文件' }
];

const states = {
  initial: assets.map(() => ({ status: 'none', time: '-' })),
  submitted: assets.map(() => ({ status: 'queued', time: '2026-06-25 10:32' })),
  partial: [
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'downloading', time: '2026-06-25 10:32' },
    { status: 'queued', time: '2026-06-25 10:32' },
    { status: 'none', time: '-' },
    { status: 'none', time: '-' }
  ],
  allDone: assets.map(() => ({ status: 'success', time: '2026-06-25 10:32' })),
  failed: [
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'failed', time: '2026-06-25 10:32' },
    { status: 'success', time: '2026-06-25 10:32' },
    { status: 'none', time: '-' },
    { status: 'none', time: '-' }
  ]
};

const statusMap = {
  none: { label: '未下载', cls: 'status-none' },
  queued: { label: '已提交待下载', cls: 'status-queued' },
  downloading: { label: '下载中', cls: 'status-downloading' },
  success: { label: '下载成功', cls: 'status-success' },
  failed: { label: '下载失败', cls: 'status-failed' }
};

function renderTable(stateData) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = stateData.map((item, i) => {
    const s = statusMap[item.status];
    const canCheck = item.status === 'none' || item.status === 'failed';
    let action = '';
    if (item.status === 'none') action = '<button class="btn-download">下载</button>';
    else if (item.status === 'queued' || item.status === 'downloading') action = '<button class="btn-download" disabled>下载</button>';
    else if (item.status === 'success') action = '<a href="#" class="download-link">下载链接</a>';
    else if (item.status === 'failed') action = '<button class="btn-retry">重新下载</button>';

    return `<tr>
      <td><input type="checkbox" class="row-check" data-index="${i}" ${canCheck ? '' : 'disabled'} onchange="updateBatch()"></td>
      <td><div class="asset-name">${assets[i].name}</div><div class="asset-desc">${assets[i].desc}</div></td>
      <td>${item.time}</td>
      <td><span class="status ${s.cls}">${s.label}</span></td>
      <td>${action}</td>
    </tr>`;
  }).join('');
}

function toggleAll(el) {
  document.querySelectorAll('.row-check:not(:disabled)').forEach(cb => cb.checked = el.checked);
  updateBatch();
}

function updateBatch() {
  const checked = document.querySelectorAll('.row-check:checked').length;
  document.getElementById('btnBatch').disabled = checked === 0;
}

function setState(state) {
  renderTable(states[state]);
  document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('selectAll').checked = false;
  updateBatch();
}

function batchDownload() {}

renderTable(states.initial);
</script>
</body>
</html>
