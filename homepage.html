<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文心一言 - 首页入口</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; min-height: 100vh; }

.top-nav { height: 56px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.nav-left { display: flex; align-items: center; gap: 16px; }
.nav-logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1a1a1a; }
.nav-logo svg { width: 28px; height: 28px; }
.nav-icons { display: flex; align-items: center; gap: 12px; color: #666; }
.nav-icon { width: 24px; height: 24px; background: #f5f5f5; border-radius: 4px; }
.nav-right { display: flex; align-items: center; gap: 16px; }

.hero { display: flex; flex-direction: column; align-items: center; padding: 80px 20px 40px; }
.hero-title { font-size: 28px; font-weight: 600; color: #1a1a1a; margin-bottom: 32px; }

.input-box { width: 680px; border: 1px solid #e0e0e0; border-radius: 16px; padding: 20px 24px; position: relative; }
.input-placeholder { font-size: 15px; color: #bbb; margin-bottom: 40px; }
.input-bottom { display: flex; justify-content: space-between; align-items: center; }
.model-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #f0f4ff; border-radius: 20px; font-size: 13px; color: #4e6ef2; }
.input-actions { display: flex; align-items: center; gap: 12px; }
.input-action-icon { width: 32px; height: 32px; background: #f5f5f5; border-radius: 50%; }
.input-action-icon.send { background: #1a1a1a; }

/* 气泡入口 */
.bubble-row { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
.bubble { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; background: #fff; border: 1px solid #e8e8e8; border-radius: 24px; font-size: 14px; color: #333; cursor: pointer; text-decoration: none; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.bubble:hover { border-color: #4e6ef2; color: #4e6ef2; box-shadow: 0 4px 12px rgba(78,110,242,0.1); }
.bubble-icon { font-size: 16px; }

/* 案例推荐 */
.cases-section { margin-top: 60px; text-align: center; }
.cases-divider { font-size: 13px; color: #bbb; display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
.cases-divider::before, .cases-divider::after { content: ''; width: 80px; height: 1px; background: #e8e8e8; }
.cases-grid { display: flex; justify-content: center; gap: 20px; padding: 0 40px; }
.case-card { width: 280px; padding: 20px; border: 1px solid #f0f0f0; border-radius: 12px; text-align: left; }
.case-tag { font-size: 12px; color: #4e6ef2; margin-bottom: 8px; }
.case-title { font-size: 14px; color: #333; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <div class="nav-logo">
      <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#4e6ef2"/><text x="7" y="19" font-size="12" fill="#fff" font-weight="bold">文</text></svg>
      文心一言
    </div>
    <div class="nav-icons">
      <div class="nav-icon"></div>
      <div class="nav-icon"></div>
    </div>
  </div>
  <div class="nav-right">
    <div class="nav-icon"></div>
    <div class="nav-icon"></div>
  </div>
</div>

<div class="hero">
  <h1 class="hero-title">中国人的微信头像进化史</h1>

  <div class="input-box">
    <div class="input-placeholder">深度分析需求并解答，你需要什么帮助？</div>
    <div class="input-bottom">
      <div class="model-tag">⊗ 文心 5.1 思考 ∨</div>
      <div class="input-actions">
        <div class="input-action-icon"></div>
        <div class="input-action-icon"></div>
        <div class="input-action-icon send"></div>
      </div>
    </div>
  </div>

  <!-- 两个独立气泡入口 -->
  <div class="bubble-row">
    <a class="bubble" href="#">
      <span class="bubble-icon">📥</span>
      数据资产下载
    </a>
    <a class="bubble" href="#">
      <span class="bubble-icon">📄</span>
      服务合并升级说明
    </a>
  </div>

  <div class="cases-section">
    <div class="cases-divider">案例推荐</div>
    <div class="cases-grid">
      <div class="case-card">
        <div class="case-tag">代码编程</div>
        <div class="case-title">"恋爱刮刮乐" Bingo小游戏</div>
      </div>
      <div class="case-card">
        <div class="case-tag">代码编程</div>
        <div class="case-title">520，试试这样和TA告白</div>
      </div>
      <div class="case-card">
        <div class="case-tag">代码编程</div>
        <div class="case-title">"爱情问答挑战"告白页</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
